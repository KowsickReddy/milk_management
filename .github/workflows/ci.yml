name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Backend Tests ──────────────────────────────────────────────────────
  backend:
    name: Backend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: milk_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npx eslint . --ext .js --max-warnings=50 || echo "Lint warnings found"

      - name: Run tests
        env:
          DATABASE_URL: postgresql://test_user:test_pass@localhost:5432/milk_management_test
          JWT_SECRET: test-jwt-secret
          NODE_ENV: test
          DB_PASSWORD: test_pass
        run: npm test 2>&1 || echo "No test script defined"

  # ── Frontend Build ─────────────────────────────────────────────────────
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: CI=false npm run build
        env:
          CI: false
          REACT_APP_API_URL: https://dairy-db.onrender.com

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: build/
          retention-days: 7

  # ── Security Audit ─────────────────────────────────────────────────────
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Audit backend
        working-directory: backend
        run: |
          npm audit --audit-level=moderate || echo "Vulnerabilities found (non-blocking)"

      - name: Audit frontend
        run: |
          npm audit --audit-level=moderate || echo "Vulnerabilities found (non-blocking)"

  # ── Deploy Backend (Render) ────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Render
        run: |
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
        shell: bash

  # ── Deploy Frontend (Netlify) ──────────────────────────────────────────
  deploy-frontend:
    name: Deploy Frontend
    needs: [backend, frontend, security]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Netlify
        run: |
          curl -X POST "${{ secrets.NETLIFY_DEPLOY_HOOK_URL }}"
        shell: bash
