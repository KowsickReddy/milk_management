name: CI - Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: CI=false npm run build
        env:
          REACT_APP_API_URL: ${{ vars.REACT_APP_API_URL || 'http://localhost:5000' }}

      - name: Check build output
        run: test -d build && echo "Build folder exists ✓" || echo "Build folder missing ✗"

  backend:
    name: Backend Syntax & Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: milk_management_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Syntax check all JS files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -exec node -c {} \;
          echo "All files pass syntax check ✓"

      - name: Run tests
        run: npm test
        env:
          JWT_SECRET: test-secret-key
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/milk_management_test
          NODE_ENV: test

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: npm audit frontend
        run: npm audit --audit-level=moderate || true
      - name: npm audit backend
        working-directory: backend
        run: npm audit --audit-level=moderate || true
